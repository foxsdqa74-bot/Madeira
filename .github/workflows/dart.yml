name: Madeira iOS Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Create vcruntime placeholder
        run: mkdir -p app/Madeira/x86_64-vcruntime

      - name: Build
        working-directory: app
        run: |
          set +e
          xcodebuild -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "=========== REAL ERRORS ==========="
            grep -E "^/.*:[0-9]+:[0-9]+: error:|^error:|^ld: |Undefined symbols|BUILD FAILED|failed with a nonzero exit code" build.log | sort -u | head -n 40
            echo "=========== LAST 60 LINES ==========="
            tail -n 60 build.log
          fi
          exit $STATUS

      - name: Package IPA
        run: |
          APP=$(find app/build/Build/Products -maxdepth 3 -name "*.app" -type d | head -n 1)
          echo "Using app: $APP"
          ls -la "$APP"

          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "Executable: $EXE"
          test -f "$APP/$EXE" || { echo "EXECUTABLE MISSING"; exit 1; }

          mkdir Payload
          cp -R "$APP" Payload/
          zip -qq -r -9 Madeira.ipa Payload
          ls -lh Madeira.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: Madeira.ipa

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Madeira.ipa
          tag: v1.0
          overwrite: true
          body: "Unsigned build"
