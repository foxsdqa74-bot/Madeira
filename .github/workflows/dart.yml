name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Show schemes
        working-directory: app
        run: xcodebuild -list -project Madeira.xcodeproj

      - name: Create vcruntime placeholder
        run: mkdir -p app/Madeira/x86_64-vcruntime

      - name: Build (no codesign)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log || true
          echo "=========== ERRORS ==========="
          grep -E "error:|fatal error|ld:|Undefined symbols" build.log | sort -u | head -n 40
          exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          APP=$(find app/build/Build/Products -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qq -r -9 Madeira.ipa Payload

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Madeira.ipa
          tag: v1.0
          overwrite: true
          body: "Unsigned build"
