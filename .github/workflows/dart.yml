name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show schemes
        working-directory: app
        run: xcodebuild -list -project Madeira.xcodeproj

      - name: Build (no codesign)
        working-directory: app
        run: |
          xcodebuild -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP=$(find app/build/Build/Products -name "*.app" -maxdepth 2 | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qq -r -9 Madeira.ipa Payload

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Madeira.ipa
          tag: v1.0
          overwrite: true
          body: "Unsigned build"
